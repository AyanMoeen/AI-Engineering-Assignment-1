# Render.com blueprint: New + -> Blueprint -> select your GitHub repo
services:
  - type: web
    name: minigpt-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHECKPOINT_URL        # e.g. a GitHub Release asset link to tiny_gpt.pt
        sync: false
